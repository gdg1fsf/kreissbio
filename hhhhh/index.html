<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>kreiss</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;400&family=Manrope:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: fullscreen drifting-smoke canvas, centered column: haloed avatar, letter-by-letter nick, two link rows */
:root{--bg:#050505;--ink:#efeeeb;--dim:#8d8d8a;--line:#262626;--panel:rgba(255,255,255,.04);--panel-hi:rgba(255,255,255,.09);--glow:rgba(255,255,255,.22);
--display:'Unbounded','Arial Black',sans-serif;--body:'Manrope','Helvetica Neue',Arial,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:400 16px/1.6 var(--body);min-height:100vh;overflow-x:hidden;
padding-block:64px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
display:flex;justify-content:center;position:relative}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
body::after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 30%,#000 100%)}
main{position:relative;z-index:2;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:30px;min-width:0}
.avatar{position:relative;width:210px;height:210px;animation:float 7s ease-in-out infinite}
.avatar::before,.avatar::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid var(--glow)}
.avatar::before{animation:pulse 4s ease-out infinite}
.avatar::after{animation:pulse 4s ease-out 2s infinite}
.avatar .img{position:absolute;inset:0;border-radius:50%;overflow:hidden;box-shadow:0 0 90px rgba(255,255,255,.16),0 0 0 1px #333}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.04)}
h1{display:flex;margin:0;font:200 clamp(44px,14vw,68px)/1 var(--display);letter-spacing:-.03em;text-transform:lowercase}
h1 span{display:inline-block;animation:letter .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*90ms + 200ms)}
.bio{margin:0;text-align:center;color:var(--dim);max-width:34ch;text-wrap:balance;animation:rise .9s ease .9s both}
.links{width:100%;display:flex;flex-direction:column;gap:12px}
.row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0;overflow:hidden;
background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px 20px;color:var(--ink);text-decoration:none;
backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .25s,border-color .25s,background .25s;animation:rise .8s ease both}
.links>:nth-child(1){animation-delay:1.1s}.links>:nth-child(2){animation-delay:1.25s}
.row::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.12) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s}
.row:hover,.row:focus-visible{transform:translateY(-3px);border-color:#666;background:var(--panel-hi);outline:none}
.row:hover::before,.row:focus-visible::before{transform:translateX(120%)}
.row small{display:block;font:400 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.row b{font-weight:500;font-size:17px;overflow-wrap:anywhere}
.row .go{font:400 14px var(--mono);color:var(--dim);white-space:nowrap}
button.row{width:100%;font:inherit;text-align:left;cursor:pointer;color:var(--ink)}
.tag{font:400 12px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:#555;animation:rise .8s ease 1.5s both}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.5);opacity:0}}
@keyframes letter{from{opacity:0;transform:translateY(24px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
  <div class="avatar"><div class="img"><img src="avatar.png" alt="Аватар kreiss"></div></div>
  <div style="display:grid;gap:12px;justify-items:center">
    <h1 aria-label="kreiss"><span style="--i:0">k</span><span style="--i:1">r</span><span style="--i:2">e</span><span style="--i:3">i</span><span style="--i:4">s</span><span style="--i:5">s</span></h1>
    <p class="bio">На связи в Telegram и Discord.</p>
  </div>
  <div class="links">
    <a class="row" href="https://t.me/krelss" target="_blank" rel="noopener">
      <div><small>Telegram</small><b>@krelss</b></div><span class="go">открыть ↗</span>
    </a>
    <button class="row" id="dc" type="button">
      <div><small>Discord</small><b>vk.rat</b></div><span class="go" id="dcs">копировать</span>
    </button>
  </div>
  <span class="tag">kreiss</span>
</main>
<script>
document.getElementById('dc').addEventListener('click',function(){
  var s=document.getElementById('dcs');
  function ok(){s.textContent='скопировано';setTimeout(function(){s.textContent='копировать'},1600)}
  try{navigator.clipboard.writeText('vk.rat').then(ok,function(){s.textContent='vk.rat'})}catch(e){s.textContent='vk.rat'}
});
(function(){
  var c=document.getElementById('bg'),x=c.getContext('2d'),W,H,D,t=0;
  var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var blobs=[],dust=[];
  function size(){D=Math.min(window.devicePixelRatio||1,2);W=c.width=innerWidth*D;H=c.height=innerHeight*D}
  size();addEventListener('resize',size);
  for(var i=0;i<5;i++)blobs.push({x:Math.random(),y:Math.random(),r:.35+Math.random()*.3,s:.04+Math.random()*.06,p:Math.random()*6.28});
  for(var j=0;j<70;j++)dust.push({x:Math.random(),y:Math.random(),r:.4+Math.random()*1.4,v:.01+Math.random()*.03,p:Math.random()*6.28});
  function frame(){
    t+=.006;
    x.fillStyle='#050505';x.fillRect(0,0,W,H);
    var m=Math.max(W,H);
    blobs.forEach(function(b){
      var bx=(b.x+Math.sin(t*b.s*10+b.p)*.18)*W,by=(b.y+Math.cos(t*b.s*9+b.p)*.18)*H,r=b.r*m;
      var g=x.createRadialGradient(bx,by,0,bx,by,r);
      g.addColorStop(0,'rgba(210,210,215,.10)');g.addColorStop(1,'rgba(0,0,0,0)');
      x.fillStyle=g;x.fillRect(0,0,W,H);
    });
    dust.forEach(function(d){
      d.y-=d.v*.004;if(d.y<-.02)d.y=1.02;
      var px=(d.x+Math.sin(t*2+d.p)*.015)*W,py=d.y*H;
      x.globalAlpha=.25+.35*Math.sin(t*3+d.p)**2;
      x.fillStyle='#fff';x.beginPath();x.arc(px,py,d.r*D,0,6.28);x.fill();
    });
    x.globalAlpha=1;
    if(!still)requestAnimationFrame(frame);
  }
  frame();
})();
</script>

</body></html>
